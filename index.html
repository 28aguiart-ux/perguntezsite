<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Perguntez: faça perguntas, compartilhe conhecimento e encontre respostas com a comunidade.">
<meta name="theme-color" content="#111111">
<meta name="application-name" content="Perguntez">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Perguntez">
<meta property="og:title" content="Perguntez — Perguntas e respostas">
<meta property="og:description" content="Um espaço para perguntar, responder e compartilhar conhecimento com a comunidade.">
<meta name="twitter:card" content="summary">
<title>Perguntez — Perguntas e respostas</title>
<style>
:root{--y:#ffc400;--y2:#ffe9a0;--k:#111;--line:#e3e3e3;--blue:#1a6fd1;--mut:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222;line-height:1.35}
a{text-decoration:none;color:inherit;cursor:pointer}
svg.i{width:18px;height:18px;fill:currentColor;flex:none}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(14px,2.8vw,36px)}
header{background:var(--k)}
.top{display:flex;align-items:center;gap:20px;height:76px}
.logo{display:flex;align-items:center;flex:none}
.logo img{height:38px;width:auto;display:block}
.logo b{background:var(--y);color:var(--k);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px}
nav{display:flex;gap:2px;flex:1}
nav a{color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;padding:0 16px;height:76px;border-bottom:3px solid transparent}
nav a:hover{color:var(--y)}
nav a.on{color:var(--y);border-bottom-color:var(--y)}
.right{display:flex;gap:8px;align-items:center}
.sbtn{width:36px;height:36px;border-radius:50%;background:#222;border:1px solid #444;color:#fff;display:flex;align-items:center;justify-content:center}
.btn{font:inherit;font-size:13px;font-weight:700;padding:9px 18px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer}
.btn.y{background:var(--y);color:var(--k)}
.btn.y:hover{background:#ffd23d}
.btn.o{background:var(--k);color:var(--y);border:2px solid var(--y)}
.btn.s{padding:7px 14px;font-size:12px}
.searchbar{display:none;background:#222;padding:10px 0}
.searchbar.on{display:block}
.searchbar input{width:100%;padding:10px 14px;border-radius:20px;border:2px solid var(--y);font-size:14px;outline:0}
main.wrap{padding-top:30px;padding-bottom:48px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.home-grid{display:grid;grid-template-columns:1fr 330px;gap:36px}
.det-grid{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
.ch{background:var(--y2);padding:16px 22px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eadb9c}
.ch .ic{background:var(--k);color:var(--y);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.ch .ic svg{width:14px;height:14px}
.ch .btn{margin-left:auto}
.q{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q:hover{background:#fffbea}
.av{width:50px;height:50px;border-radius:50%;color:#fff;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.me{background:#d5d7da;align-items:flex-end}
.av .sil{width:86%;height:86%;fill:#80858b}
.av.md{width:72px;height:72px;font-size:38px;border:3px solid var(--y)}
.av.lg{width:190px;height:190px;font-size:98px;border:4px solid var(--y)}
.avl{display:inline-flex;flex:none}
.who a:hover,.meta a:hover{text-decoration:underline}
.asker{padding:20px;text-align:center}
.asker .avl{margin-bottom:12px}
.asker h3{font-size:20px;color:var(--k)}
.asker .btns{display:flex;gap:8px;margin-top:12px}
.asker .btns .btn{flex:1;padding:10px 6px}
.btn.g{background:#eee;color:var(--k)}
.btn.g:hover{background:#e2e2e2}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.qtop b{font-size:15px;color:var(--k);display:block}
.qtop small{font-size:12px;color:var(--mut)}
.qt{flex:1;min-width:0}
.qt b{display:block;font-size:17px;font-weight:600;color:var(--k);margin-bottom:3px}
.qt small{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qt small em{font-style:normal;color:var(--blue);font-weight:700;margin-right:4px}
.qt small svg{width:12px;height:12px}
.qs{font-size:12px;color:var(--mut);display:grid;gap:5px;min-width:150px}
.qs span{display:flex;align-items:center;gap:6px}
.qs svg{width:13px;height:13px}
.side{display:flex;flex-direction:column;gap:16px}
.dark{background:var(--k);color:#fff;border-radius:6px;padding:14px}
.dark h3{color:var(--y);font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #2b2b2b;font-size:13px}
.rk:last-child{border-bottom:0}
.rk .n{font-size:18px;font-weight:800;width:16px}
.rk div b{display:block}.rk div small{color:var(--y);font-size:11px}
.more{display:block;text-align:center;color:var(--y);font-size:12px;font-weight:700;margin-top:10px}
.cta{background:var(--k);border:2px solid var(--y);border-radius:6px;padding:14px;color:#fff}
.cta h3{color:var(--y);font-size:15px;margin-bottom:6px}
.cta p{font-size:13px;margin-bottom:12px}
.cta .btn{display:flex;width:100%}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff3c2;border:1px solid var(--y);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;margin:12px 16px 4px}
.empty{padding:18px 16px;font-size:14px;color:#555}

/* pergunta aberta */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:12px}
.back svg{transform:rotate(180deg);width:16px;height:16px}
.qhead{padding:26px;background:#fff;border-bottom:1px solid var(--line)}
.qhead h1{font-size:30px;color:var(--k);margin:0 0 16px}
.cat{display:inline-block;background:#f0f0f0;color:#333;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.meta span{display:flex;align-items:center;gap:5px}
.meta svg{width:13px;height:13px}
 .qdesc{margin-top:14px;font-size:16px;color:#333}
.qmeta{margin-top:12px}
.qactions{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.qactions .vote{min-width:76px;justify-content:center}
.qactions .vote.down svg{transform:rotate(180deg)}
.nresp{background:#f4f4f4;padding:14px 16px;font-weight:700;font-size:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ans{display:flex;gap:16px;padding:20px 26px;border-bottom:1px solid var(--line)}
.ans:last-child{border-bottom:0}
.ans.best{background:#fff}
.ab{flex:1}
.ab .who{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ab .who b{color:var(--k)}
.ab .who small{color:var(--mut)}
.badge{background:#1f9d4d;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-flex;gap:4px;align-items:center}
.badge svg{width:11px;height:11px}
.ab p{font-size:15px;color:#222;margin-bottom:10px;white-space:pre-wrap}
.vote{font:inherit;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1px solid #ccc;background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;color:#444}
.vote svg{width:14px;height:14px}
.vote.down svg{transform:rotate(180deg)}
.response-votes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vote:hover{border-color:var(--y)}
.vote.on{background:var(--y);border-color:var(--y);color:var(--k)}
.form{padding:16px}
.form h3{font-size:15px;margin-bottom:10px}
.form label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
.form input,.form textarea,.form select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid #ccc;border-radius:6px;outline:0}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--y);box-shadow:0 0 0 2px #ffe58a}
.form textarea{min-height:100px;resize:vertical}
.form .btn{margin-top:12px;padding:11px 22px}
.err{color:#c0392b;font-size:12px;margin-top:6px;min-height:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px}
.catbox{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.catbox:hover{border-color:var(--y);background:#fffbea}

/* perfil */
.prof-grid{display:grid;grid-template-columns:340px 1fr;gap:22px}
.pcard{padding:18px;text-align:center}
.pcard > .av{display:block;margin:0 auto 14px}
.pcard .avl{display:flex;justify-content:center;margin-bottom:14px}
.pcard h2{font-size:22px;color:var(--k)}
.since{font-size:12px;color:var(--mut);display:flex;gap:6px;justify-content:center;align-items:center;margin:6px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.since svg{width:14px;height:14px}
.stat{display:flex;gap:12px;align-items:center;text-align:left;padding:8px 4px}
.stat svg{width:22px;height:22px;fill:var(--k)}
.stat b{display:block;font-size:17px;color:var(--k)}
.stat small{font-size:12px;color:var(--mut)}
.pcard .btn{width:100%;margin-top:12px;padding:12px;font-size:14px}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-weight:700;font-size:15px;background:#fff;color:var(--k)}
.tab.on{background:var(--k);color:#fff}
.tab.on svg{color:var(--y)}
.sec{margin-bottom:16px}
.sh{background:#f4f4f4;padding:14px 16px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sh a{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.sh a svg{width:16px;height:16px}
.follower-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.follower-row:last-child{border-bottom:0}
.follower-row .qt{flex:1;min-width:0}
.follower-row .qt b{font-size:15px}
.follower-row .qt small{font-size:12px;color:var(--mut)}
@media(max-width:780px){.follower-row{padding:11px 12px}.follower-row .btn{white-space:nowrap}}
/* ===== página inicial no estilo novo ===== */
.hl-h{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500;padding:4px 6px 16px;color:var(--k)}
.hl-h svg{width:22px;height:22px;fill:var(--k)}
.hl-list{border-top:1px solid #e7e7e7}
.hl .q{padding:15px 6px;gap:16px;border-bottom:1px solid #e7e7e7}
.hl .q:last-child{border-bottom:1px solid #e7e7e7}
.hl .qt b{font-weight:400;font-size:17px;color:#222}
.hl .qt small{color:#555}
.hl .qs{color:#555}
.hl .qs svg{width:15px;height:15px}
.hs{display:flex;flex-direction:column;gap:30px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--k);color:#fff;font-weight:700;font-size:16px;padding:9px 18px 9px 14px;border-radius:22px;margin-bottom:8px}
.pill svg{fill:var(--y);width:20px;height:20px}
.hr{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #e7e7e7;font-size:14px;color:var(--k)}
.hr:hover{background:#fffbea}
.hr .n{font-size:20px;font-weight:800;width:20px;text-align:center}
.hr .nm{flex:1;font-weight:500}
.hr .pt{font-size:12px;color:#777}
.hmore{display:block;text-align:center;font-size:12px;color:#333;margin-top:12px}
.hmore:hover{text-decoration:underline}
.hcta-box{display:flex;align-items:center;gap:10px;margin-top:2px}
.hcta-box p{flex:1;font-size:14px;color:#222}
.hcta-box svg{width:72px;height:72px;fill:var(--y);flex:none}
.hcta .btn{display:flex;width:max-content;margin:14px auto 0;padding:12px 30px;font-size:14px}
/* ===== proporções da página inicial (como na imagem) ===== */
.hl-h{font-size:20px;padding:4px 6px 14px}
.hl .q{padding:7px 6px;gap:14px}
.hl .av,.hr .av{width:48px;height:48px;font-size:24px}
.hl .qt b{font-size:18px;margin-bottom:1px}
.hl .qt small{font-size:13px}
.hl .qs{font-size:12px;min-width:140px;gap:3px}
.hs{gap:26px}
.pill{font-size:17px;padding:10px 20px 10px 15px;margin-bottom:6px}
.hr{padding:3px 4px;gap:12px}
.hr .nm{font-size:15px}
.hr .pt{font-size:12px}
.hmore{margin-top:10px}
.hcta-box p{font-size:14px}
.hcta-box svg{width:64px;height:64px}
.hcta .btn{padding:12px 32px}
@media(max-width:780px){
 .wrap{padding:0 10px}
 main.wrap{padding-top:16px;padding-bottom:28px}
 /* cabeçalho: logo + botões em cima, menu embaixo */
 .top{flex-wrap:wrap;height:auto;gap:0;padding-top:8px}
 .logo img{height:30px}
 .right{margin-left:auto;gap:6px}
 .btn{padding:8px 13px}
 nav{order:3;width:100%;margin-top:6px}
 nav a{flex:1;flex-direction:column;justify-content:center;gap:3px;height:50px;padding:0 4px;font-size:11px}
 .hu span{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 /* conteúdo em uma coluna: a parte preta (ranking) fica embaixo */
 .home-grid,.prof-grid{grid-template-columns:1fr;gap:14px}
 .side,.hs{order:2}
 .q,.hl .q{flex-wrap:wrap;gap:10px;padding:12px 6px}
 .hl .qt b{font-size:16px}
 .hl .av,.hr .av{width:42px;height:42px;font-size:21px}
 .hl .q{padding:11px 6px}
 .hr{padding:6px 4px}
 .qs{display:flex;gap:14px;width:100%;padding-left:52px;margin-top:-4px}
 .ch{padding:12px 14px;font-size:15px}
 .qhead{padding:16px;background:#fff}
 .qhead h1{font-size:22px}
 .ans{padding:14px 16px;gap:12px}
 .av.lg{width:130px;height:130px;font-size:66px}
 .tab{font-size:13px;padding:12px 6px;gap:5px}
 .tab svg{width:16px;height:16px}
}
}
.auth{max-width:460px;margin:10px auto}
.auth .btns{display:flex;gap:10px;margin-top:10px}
.auth .btns .btn{flex:1}
.chk{display:flex!important;align-items:center;gap:8px;font-weight:400!important;margin-top:10px!important;cursor:pointer}
.chk input{width:auto!important}
.troca{font-size:13px;text-align:center;margin-top:14px;color:#555}
.troca a{color:var(--blue);font-weight:700}
.hu{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:700;margin-right:4px}
.hu .av{width:34px;height:34px;border:2px solid var(--y)}
.hu:hover{color:var(--y)}

footer{background:#fff;color:#666;margin-top:6px;border-top:1px solid var(--line)}
.fwrap{padding-top:10px;padding-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px}
.flinks{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center}
.flinks a{color:#222;font-size:12px;font-weight:700}
.flinks a:hover{color:var(--blue)}
.fcopy{font-size:11px;color:#777;line-height:1.4}
.fcopy a{color:var(--blue)}
.share-area{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.share-label{font-size:12px;font-weight:800;color:#222}
.share-toggle{font:inherit;font-size:12px;font-weight:800;color:#222;padding:7px 13px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer}
.share-toggle:hover{border-color:var(--y);background:var(--y2)}
.share-options{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.share-options.open{display:flex}
.share-link{font-size:12px;font-weight:700;color:#222;padding:6px 10px;border:1px solid var(--line);border-radius:18px;background:#fff}
.share-link:hover{border-color:var(--y);background:var(--y2)}
.notif-page{max-width:900px;margin:0 auto}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);color:var(--k)}
.notif-item.unread{background:#fffbea}
.notif-icon{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:var(--y2);color:var(--k)}
.notif-icon svg{width:19px;height:19px;fill:currentColor}
.notif-body{flex:1;min-width:0;font-size:14px;line-height:1.45}
.notif-body small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
.notif-empty{padding:35px 18px;text-align:center;color:var(--mut)}
.info{padding:22px 26px 26px;font-size:15px;line-height:1.65;color:#333}
.info h3{font-size:16px;margin:18px 0 6px;color:#111}
.info p{margin-bottom:10px}
.info a.mail{color:var(--blue);font-weight:700;word-break:break-all}
.info .btn{margin-top:8px}
@media(max-width:780px){.info{padding:16px}.fwrap{justify-content:center;text-align:center}}

/* ===== chat ===== */
.cbtn{position:relative}
.cbtn:hover,.sbtn:hover{border-color:var(--y);color:var(--y)}
.cbtn.on{background:var(--y);color:var(--k);border-color:var(--y)}
.nbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e53935;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--k)}
.tab .nbadge{position:static;border:0;margin-left:2px}
.chatbox{display:grid;grid-template-columns:250px 1fr;min-height:460px}
.chatbox.solo{grid-template-columns:1fr}
.clist{border-right:1px solid var(--line);overflow-y:auto;max-height:520px}
.citem{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--k)}
.citem:hover{background:#fffbea}
.citem.on{background:var(--y2)}
.citem .av{width:40px;height:40px;font-size:20px}
.citem div{flex:1;min-width:0}
.citem b{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.citem b small{font-weight:400;font-size:11px;color:var(--mut)}
.citem p{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem.nl p{color:var(--k);font-weight:700}
.citem .dot{width:9px;height:9px;border-radius:50%;background:#e53935;flex:none}
.conv{display:flex;flex-direction:column;min-width:0}
.chd{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--k);color:#fff}
.chd .av{width:36px;height:36px;font-size:18px;border:2px solid var(--y)}
.chd b{display:block;font-size:14px}
.chd small{font-size:11px;color:var(--y)}
.chd .lk{margin-left:auto;font-size:12px;font-weight:700;color:var(--y)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fafafa;max-height:400px;min-height:300px}
.bub{max-width:76%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:#fff;border:1px solid var(--line);font-size:14px;align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.bub.eu{align-self:flex-end;background:var(--y);border-color:var(--y);border-radius:16px 16px 4px 16px}
.bub time{display:block;font-size:10px;color:var(--mut);margin-top:3px;text-align:right}
.bub.eu time{color:#6b5500}
.dia{align-self:center;font-size:11px;color:var(--mut);background:#eee;border-radius:10px;padding:2px 10px}
.csend{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.csend input{flex:1;font:inherit;font-size:14px;padding:10px 14px;border:1px solid #ccc;border-radius:20px;outline:0}
.csend input:focus{border-color:var(--y);box-shadow:0 0 0 2px #ffe58a}
.csend .btn{padding:0 16px}
.cvazio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;color:var(--mut);font-size:14px}
.cvazio svg{width:54px;height:54px;fill:var(--y)}
/* ===== página independente de mensagens ===== */
.messages-page{max-width:1100px;margin:0 auto}
.messages-page .chatbox{min-height:600px}
.messages-page .msgs{max-height:none;min-height:420px}
@media(max-width:780px){.messages-page .msgs{min-height:52vh}}
/* ===== página exclusiva de contatos ===== */
.contacts-page{max-width:900px;margin:0 auto}
.contacts-intro{padding:20px 22px;border-bottom:1px solid var(--line)}
.contacts-intro h1{font-size:24px;color:var(--k);margin-bottom:5px}
.contacts-intro p{font-size:14px;color:var(--mut)}
.contacts-tools{padding:14px 18px;border-bottom:1px solid var(--line)}
.contacts-tools input{width:100%;font:inherit;font-size:14px;padding:12px 15px;border:1px solid #ccc;border-radius:22px;outline:0}
.contacts-tools input:focus{border-color:var(--y);box-shadow:0 0 0 2px #ffe58a}
.contacts-list{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;padding:4px 18px}
.contact-card{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);min-width:0}
.contact-card .av{width:48px;height:48px;font-size:23px}
.contact-info{flex:1;min-width:0}
.contact-info b{display:block;color:var(--k);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.contact-info small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.contact-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.contact-actions .btn{white-space:nowrap}
@media(max-width:780px){
 .contacts-list{grid-template-columns:1fr;padding:2px 12px}
 .contacts-intro{padding:16px}
 .contact-card{gap:10px}
 .contact-actions .btn{padding:7px 10px}
}
@media(max-width:780px){
 .chatbox{grid-template-columns:1fr}
 .chatbox.aberta .clist{display:none}
 .chatbox:not(.aberta):not(.solo) .conv{display:none}
 .clist{border-right:0;max-height:none}
 .msgs{max-height:58vh}
 .bub{max-width:86%}
}

/* Ajuste visual: remove apenas os contornos/separadores da página da pergunta */
.detail > .card.sec{border-color:transparent}
.detail .qhead{border-bottom-color:transparent}
.detail .nresp{border-top-color:transparent;border-bottom-color:transparent}
.detail .ans{border-bottom-color:transparent}

/* Perfil do usuário: remove somente contornos e sombras dos cards.
   O escopo cobre #/perfil/... e #/usuario/...; a home não é afetada.
   Não altera margens, larguras, dimensões, padding ou posicionamento. */
.profile-page .prof-grid > .pcard,
.profile-page .prof-grid .sec{
  border: none !important;
  box-shadow: none !important;
}
.profile-page .prof-grid .sec > .sh{
  border-bottom: none !important;
}


/* Perguntas anônimas */
.anonymous-option{display:flex!important;align-items:center;gap:9px;margin:14px 0 4px!important;font-size:14px!important;font-weight:600!important;cursor:pointer}
.anonymous-option input{width:17px!important;height:17px;accent-color:var(--y)}
.anonymous-hint{font-size:12px;color:var(--mut);margin:4px 0 8px}
.anonymous-hint.limit{color:#c0392b;font-weight:700}
.av.anonymous-avatar{background:#e7e7e7;color:#666;border:1px solid #d5d5d5;font-size:22px}
.anon-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9998;display:flex;align-items:center;justify-content:center;padding:18px}
.anon-modal{background:#fff;border-radius:10px;max-width:390px;width:100%;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
.anon-modal h3{font-size:18px;margin-bottom:8px;color:#111}
.anon-modal p{font-size:14px;color:#555;margin-bottom:18px}
.anon-modal .btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}


/* ===== comentários nas respostas ===== */
.answer-time{
  border:0;background:transparent;padding:0;color:var(--mut);font:inherit;font-size:12px;
  cursor:pointer;text-decoration:none;
}
.answer-time:hover{color:var(--blue);text-decoration:underline}
.answer-comments{margin-top:10px}
.comment-count{
  border:0;background:transparent;padding:3px 0;color:var(--blue);font:inherit;
  font-size:12px;cursor:pointer
}
.comment-count:hover{text-decoration:underline}
.comment-thread{
  margin:8px 0 0 2px;padding:10px 0 0 16px;border-left:2px solid #e8e8e8;
}
.comment-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0}
.comment-item .av{width:30px;height:30px;font-size:15px;flex:none}
.comment-content{min-width:0;flex:1}
.comment-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.comment-head a{font-size:12px;font-weight:700;color:var(--k)}
.comment-head small{font-size:11px;color:var(--mut)}
.comment-text{font-size:13px;color:#333;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-form{display:flex;gap:8px;align-items:flex-end;margin:8px 0 2px 2px;padding:10px 0 0 16px;border-left:2px solid var(--y)}
.comment-form textarea{
  flex:1;min-width:0;min-height:38px;max-height:120px;resize:vertical;
  font:inherit;font-size:13px;padding:9px 11px;border:1px solid #ccc;border-radius:7px;outline:0
}
.comment-form textarea:focus{border-color:var(--y);box-shadow:0 0 0 2px #ffe58a}
.comment-form .btn{padding:8px 13px;font-size:12px}
.comment-error{font-size:11px;color:#c0392b;margin:4px 0 0 18px}
@media(max-width:780px){
  .comment-form{align-items:stretch;flex-direction:column}
  .comment-form .btn{align-self:flex-end}
  .comment-thread{padding-left:12px}
}

/* Campos de texto: foco discreto, sem destaque amarelo */
input:focus,
textarea:focus,
select:focus{
  outline:none !important;
  box-shadow:none !important;
  border-color:#999 !important;
}
.mod-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;color:#333;cursor:pointer}
.mod-btn:hover{border-color:var(--k)}
.mod-btn.danger{color:#b42318;border-color:#f3c4c0}
.mod-btn.danger:hover{background:#fff1f0;border-color:#b42318}
.comment-head .mod-btn{margin-left:auto;padding:2px 10px}
.admin-chip{font-size:12px;font-weight:700;background:var(--k);color:var(--y);padding:6px 12px;border-radius:16px}
.admin-chip:hover{background:#333}
.admin-tag{font-size:11px;font-weight:700;background:var(--y2);color:var(--k);padding:2px 8px;border-radius:10px}
.admin-page{display:flex;flex-direction:column;gap:16px}
.admin-page .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.admin-stats{display:flex;flex-wrap:wrap;gap:12px;padding:16px}
.admin-stat{flex:1 1 120px;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.admin-stat b{font-size:26px}
.admin-stat span{font-size:13px;color:var(--mut)}
.admin-mut{color:var(--mut);font-size:13px}
.admin-tip{padding:0 16px 16px}
.admin-table-wrap{overflow-x:auto;padding:0 16px 16px}
.admin-table{width:100%;border-collapse:collapse;font-size:14px}
.admin-table th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}
.admin-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.admin-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>

<script>
const DEMO = "";
let ranking = []; // calculado com dados reais do servidor (atualizarRanking)
function atualizarRanking(){
  ranking = Object.keys(D.users || {})
    .map(n => [n, stats(n).pts])
    .filter(r => r[1] > 0)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "pt-BR"));
}

/* ================= ESTADO (vem 100% do servidor / Cloudflare D1) ================= */
// Nada de conteúdo é guardado no navegador: todos os usuários veem os mesmos dados do banco.
try { ["perguntez-v5","perguntez-v4","perguntez-v3","perguntez"].forEach(k => localStorage.removeItem(k)); } catch(e){}
let D = {q: [], users: {}, notificacoes: [], seg: {}, seguidores: {}, chats: {}, lido: {}, nextId: 1, sessao: null, admin: false, carregado: false};
const ME = () => (D.sessao && D.users[D.sessao]) ? D.sessao : null;
let depois = "#/";
const save = () => {};
let pulsoAtual = "";
async function lerPulso(){ const r = await apiRequest("/pulso"); return r.p || ""; }
let busca = "", cat = "";
const API_BASE = "/api";
async function apiRequest(path, options = {}) {
  const response = await fetch(API_BASE + path, {
    method: options.method || "GET",
    credentials: "same-origin",
    headers: {
      ...(options.body ? {"Content-Type":"application/json"} : {}),
      ...(options.headers || {})
    },
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  const isJson = (response.headers.get("Content-Type") || "").includes("application/json");
  if (!isJson) {
    throw new Error("A API do Perguntez não está ativa neste endereço (o arquivo _worker.js não foi carregado). Publique com \"npm run deploy\" ou como Cloudflare Pages com o banco D1 ligado como DB.");
  }
  let data = {};
  try { data = await response.json(); } catch(e) {}
  if (!response.ok) throw new Error(data.error || `Erro na comunicação com o servidor (${response.status}).`);
  return data;
}
function avisoServidor(msg) {
  let el = document.getElementById("avisoServidor");
  if (!msg) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "avisoServidor";
    el.setAttribute("role", "alert");
    el.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#b42318;color:#fff;padding:12px 16px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)";
    document.body.appendChild(el);
  }
  el.textContent = "Servidor indisponível: " + msg;
}
function usuarioDaAPI(user) {
  if (!user || !user.username) return;
  D.users[user.username] = {
    ...(D.users[user.username] || {}),
    email: user.email || "",
    foto_v: Number(user.foto_v || 0),
    sobre: user.sobre || "",
    desde: user.created_at
      ? new Date(user.created_at).toLocaleDateString("pt-BR", {month:"long", year:"numeric"})
      : (D.users[user.username] && D.users[user.username].desde) || ""
  };
  D.sessao = user.username;
  D.admin = !!user.is_admin;
}
const ADM = () => !!(ME() && D.admin);
function mapPerguntaAPI(q) {
  const data = q.tempo ? new Date(q.tempo) : null;
  return {
    id: Number(q.id), t: q.t || "", c: q.c || "Outros",
    a: q.a || "Anônimo", autor: q.autor || q.a || "Anônimo",
    anonima: !!q.anonima,
    tempo: data && !Number.isNaN(data.getTime()) ? data.toLocaleString("pt-BR") : (q.tempo || "recentemente"),
    created_at: q.tempo || null,
    v: Number(q.v || 0), d: q.d || "", mine: !!q.mine,
    gostei: Number(q.gostei || 0), naoGostei: Number(q.naoGostei || 0),
    r: Array.isArray(q.r) ? q.r.map(r => ({
      id: Number(r.id), a: r.a || "Usuário",
      tempo: r.tempo ? (new Date(r.tempo).toLocaleString("pt-BR")) : "recentemente",
      x: r.x || "", n: Number(r.n || 0), dn: Number(r.dn || 0), m: Number(r.m || 0),
      mine: !!r.mine,
      comentarios: Array.isArray(r.comentarios) ? r.comentarios.map(c => ({
        id: Number(c.id), mine: !!c.mine,
        a: c.a || "Usuário", x: c.x || "",
        tempo: c.tempo ? new Date(c.tempo).toLocaleString("pt-BR") : "agora mesmo",
        criadoEm: Date.parse(c.tempo) || 0
      })) : []
    })) : []
  };
}
function aplicarUsuarios(lista) {
  const eu = D.sessao, meus = eu && D.users[eu] ? D.users[eu] : null;
  D.users = {};
  (lista || []).forEach(u => {
    D.users[u.username] = {
      foto_v: Number(u.foto_v || 0),
      sobre: u.sobre || "",
      perguntas: Number(u.perguntas || 0),
      respostas: Number(u.respostas || 0),
      desde: u.created_at ? new Date(u.created_at).toLocaleDateString("pt-BR", {month:"long", year:"numeric"}) : ""
    };
  });
  if (eu && meus) D.users[eu] = {...meus, ...(D.users[eu] || {}), email: meus.email || ""};
}
let sincronizando = null;
function carregarDadosServidor() {
  if (!sincronizando) sincronizando = carregarDadosServidorAgora().finally(() => { sincronizando = null; });
  return sincronizando;
}
async function carregarDadosServidorAgora() {
  try {
    const sessao = await apiRequest("/me");
    D.sessao = null;
    D.admin = false;
    if (sessao.user) usuarioDaAPI(sessao.user);
    await carregarPerguntasServidor();
    if (ME()) await sincronizarSocial();
    avisoServidor("");
    D.carregado = true;
    pulsoAtual = await lerPulso().catch(() => pulsoAtual);
    const el = document.activeElement;
    const digitando = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.id !== "sinput";
    if (digitando && !/^#\/mensagens/.test(location.hash)) renderHeader(); else render(true);
  } catch (error) {
    console.warn("Perguntez: não foi possível sincronizar com a API.", error);
    avisoServidor(error && error.message ? error.message : "tente novamente em instantes.");
  }
}
const voted = {}; // votos nas respostas durante a sessão
const votedPergunta = {}; // reações às perguntas durante a sessão
const comentariosAbertos = new Set(); // caixas abertas na página atual
/* ================= UTILITÁRIOS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ico = n => `<svg class="i"><use href="#${n}"/></svg>`;
const cores = ["#e67e22","#2980b9","#8e44ad","#16a085","#c0392b","#2c3e50","#d35400","#27ae60"];
const FOTOS = {};
const U = FOTOS;
/* tamanho: "" (lista), "md" (média), "lg" (grande, com borda amarela) */
function avatar(n, size){
  const reg = D.users[n];
  const f = reg ? (reg.foto_v ? `/api/usuarios/${encodeURIComponent(n)}/foto?v=${reg.foto_v}` : null) : FOTOS[n];
  const sil = !!reg;
  const c = "av " + (size || "") + (sil && !f ? " me" : "");
  if (f) return `<div class="${c}"><img src="${f}" alt="${esc(n)}"></div>`;
  if (sil) return `<div class="${c}"><svg class="sil"><use href="#person"/></svg></div>`;
  let h = 0; for (const ch of n) h = (h*31 + ch.charCodeAt(0)) % 997;
  return `<div class="${c}" style="background:${cores[h % cores.length]}">${esc(n[0].toUpperCase())}</div>`;
}
function avatarAutorPergunta(q, size){
  return q && q.anonima
    ? `<div class="av ${size || ""} anonymous-avatar" role="img" aria-label="Avatar anônimo"><svg class="sil"><use href="#person"/></svg></div>`
    : avatar(q.a, size);
}
function nomeAutorPergunta(q){ return q && q.anonima ? "Anônimo" : q.a; }
function linkAutorPergunta(q, size){
  return q && q.anonima
    ? avatarAutorPergunta(q, size)
    : avLink(q.a, size);
}
function dataLocalHoje(){
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
}
function perguntasAnonimasHoje(usuario){
  const hoje = dataLocalHoje();
  return D.q.filter(q => {
    const autor = q.autor || q.a;
    const quando = q.created_at || q.anonimaEm || q.criadaEm;
    const dia = quando ? (typeof quando === "string" && quando.includes("T")
      ? dataLocalDeTimestamp(quando) : String(quando).slice(0,10)) : "";
    return autor === usuario && q.anonima && dia === hoje;
  }).length;
}
function dataLocalDeTimestamp(ts){
  const d = new Date(ts);
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
}
function alternarAnonimo(campo){
  if (campo.checked && !ME()){
    campo.checked = false;
    abrirModalLoginAnonimo();
    return;
  }
  const aviso = document.getElementById("anonimoAviso");
  if (aviso) aviso.textContent = campo.checked
    ? "Seu nome e sua foto não serão exibidos nesta pergunta."
    : "Você pode publicar até 3 perguntas anônimas por dia.";
}
function abrirModalLoginAnonimo(){
  if (document.getElementById("anonLoginModal")) return;
  document.body.insertAdjacentHTML("beforeend", `<div class="anon-modal-backdrop" id="anonLoginModal" onclick="if(event.target===this)this.remove()">
    <div class="anon-modal" role="dialog" aria-modal="true" aria-labelledby="anonLoginTitle">
      <h3 id="anonLoginTitle">Faça login para perguntar anonimamente</h3>
      <p>O recurso de perguntas anônimas está disponível apenas para usuários conectados.</p>
      <div class="btns"><a class="btn y" href="#/entrar" onclick="document.getElementById('anonLoginModal').remove();depois='#/perguntar'">Entrar</a>
      <button class="btn g" onclick="document.getElementById('anonLoginModal').remove()">Agora não</button></div>
    </div></div>`);
}

const userHref = n => n === ME() ? "#/perfil" : "#/usuario/" + encodeURIComponent(n);
const avLink = (n, size) => `<a class="avl" href="${userHref(n)}">${avatar(n, size)}</a>`;
function stats(n){
  const mine = D.q.filter(q => q.a === n).length;
  const nR = D.q.reduce((s,q) => s + q.r.filter(r => r.a === n).length, 0);
  const u = D.users[n];
  const p = u && Number.isFinite(u.perguntas) ? u.perguntas : mine;
  const r = u && Number.isFinite(u.respostas) ? u.respostas : nR;
  return {p, r, pts: 5*r + 2*p};
}

function rankRows(n){
  if (!ranking.length) return '<div class="empty">Ainda não há pontuação. Pergunte e responda para entrar no ranking!</div>';
  return ranking.slice(0,n).map((r,i) => `<a class="hr" href="#/usuario/${encodeURIComponent(r[0])}"><span class="n">${i+1}</span>${avatar(r[0])}<span class="nm">${r[0]}</span><span class="pt">${r[1]} pontos</span></a>`).join("");
}

  return `<div class="hs" style="max-width:640px;margin:0 auto"><div><span class="pill">${ico("trophy")}Ranking completo</span>${rankRows(ranking.length)}</div></div>`;
}

    const comentarios = Array.isArray(r.comentarios) ? r.comentarios : [];
    const chaveComentario = q.id + "-" + i;
    const aberto = comentariosAbertos.has(chaveComentario);

function viewPerfil(user, tab, extra){
  user = user || ME(); tab = tab || "perguntas";
  const eu = user === ME();
  const minhas = D.q.filter(q => q.a === user);
  const respondidas = D.q.filter(q => q.r.some(r => r.a === user));
  const st = stats(user);
  const base = eu ? "#/perfil/" : "#/usuario/" + encodeURIComponent(user) + "/";
  const lista = arr => arr.length ? arr.map(q => `
    <a class="q" href="#/pergunta/${q.id}">${avatar(q.a)}<div class="qt"><b>${esc(q.t)}</b><small>${ico("clock")}${esc(q.tempo)}</small></div></a>`).join("")
    : '<div class="empty">Nada por aqui ainda.</div>';
  let pane;
  if (tab === "perguntas") pane = `<div class="card sec"><div class="sh">Perguntas Recentes<a href="#/">Ver todas ${ico("arrow")}</a></div>${lista(minhas)}</div>`;
  else if (tab === "respostas") pane = `<div class="card sec"><div class="sh">Respostas Recentes<a href="#/">Ver todas ${ico("arrow")}</a></div>${lista(respondidas)}</div>`;
  else if (tab === "seguidores") {
    const seguidores = (D.seguidores && D.seguidores[user]) || [];
    // Reconstrói quem este perfil segue a partir da lista de seguidores
    // armazenada para cada usuário, funcionando também ao visitar outros perfis.
    const seguindo = Object.keys(D.seguidores || {}).filter(nome =>
      (D.seguidores[nome] || []).includes(user)
    );

    pane = `
      <div class="card sec">
        <div class="sh">Seguidores <small style="font-weight:400;color:#777">${pl(seguidores.length, "seguidor", "seguidores")}</small></div>
        ${seguidores.length ? seguidores.map(nome => `<div class="q follower-row">${avatar(nome)}<div class="qt"><b>${esc(nome)}</b><small>Segue este perfil</small></div><a class="btn g s" href="#/usuario/${encodeURIComponent(nome)}">Ver perfil</a></div>`).join("") : `<div class="empty">Este perfil ainda não tem seguidores.</div>`}
      </div>

      <div class="card sec">
        <div class="sh">Seguindo <small style="font-weight:400;color:#777">${seguindo.length} seguindo</small></div>
        ${seguindo.length ? seguindo.map(nome => `<div class="q follower-row">${avatar(nome)}<div class="qt"><b>${esc(nome)}</b><small>Este perfil segue</small></div><a class="btn g s" href="#/usuario/${encodeURIComponent(nome)}">Ver perfil</a></div>`).join("") : `<div class="empty">Este perfil ainda não segue ninguém.</div>`}
      </div>`;
  }
  else if (tab === "chat") pane = viewChat(user, eu, extra);
  else pane = `<div class="card sec"><div class="sh">Pontos</div><div class="empty">${eu ? "Você tem" : esc(user) + " tem"} <b>${st.pts} pontos</b>.${eu ? " Cada resposta vale 5 pontos e cada pergunta vale 2." : ""}</div></div>`;
  const T = (k,i,n) => `<a class="tab ${tab === k ? "on" : ""}" href="${base}${k}">${ico(i)}${n}</a>`;
  const acao = eu
    ? `<label class="btn g" style="margin-top:12px;width:100%;padding:12px">${ico("pencil")}Alterar foto<input type="file" accept="image/*" hidden onchange="trocarFoto(this)"></label>`
    : `<button class="btn y" onclick="seguir('${esc(user)}')">${ico("userplus")}${D.seg && D.seg[user] ? "Seguindo" : "Seguir"}</button>
       <a class="btn o" style="width:100%;margin-top:8px;padding:12px;font-size:14px" href="#/mensagens/${encodeURIComponent(user)}">${ico("msg")}Enviar mensagem</a>`;
  const nl = eu ? naoLidas() : 0;
  return `<div class="prof-grid">
    <div class="card pcard">
      ${avatar(user, "lg").replace('class="av', 'class="av')}
      <h2>${esc(user)}</h2>
      <div class="since">${ico("cal")}Membro desde ${desde(user)}</div>
      <div class="stat">${ico("chat")}<div><b>${st.p}</b><small>Perguntas feitas</small></div></div>
      <div class="stat">${ico("check")}<div><b>${st.r}</b><small>Respostas</small></div></div>
      <div class="stat">${ico("star")}<div><b>${st.pts}</b><small>Pontos</small></div></div>
      ${eu ? `<a class="btn y" href="#/perfil/editar">${ico("pencil")}Editar perfil</a>` : ""}
      ${acao}
    </div>
    <div>
      <div class="tabs">${T("perguntas","chat","Perguntas")}${T("respostas","check","Respostas")}${T("pontos","trophy","Pontos")}${T("seguidores","userplus","Seguidores" + (((D.seguidores && D.seguidores[user]) || []).length ? ` (${D.seguidores[user].length})` : ""))}</div>
      <div class="card sec"><div class="sh">Sobre mim${eu ? `<a href="#/perfil/editar">${ico("pencil")}Editar perfil</a>` : ""}</div><div style="padding:16px;white-space:pre-wrap">${esc((D.users[user] && D.users[user].sobre) || (eu ? "Ainda não adicionou uma descrição." : "Este usuário ainda não adicionou uma descrição."))}</div></div>
      ${pane}
    </div></div>`;
}

function exigir(){ if (ME()) return true; depois = location.hash || "#/"; location.hash = "#/entrar"; return false; }
function votarPergunta(qid, tipo){
  if (!exigir()) return;
  const q = D.q.find(x => x.id === qid);
  if (!q) return;
  const anterior = votedPergunta[qid];
  if (anterior === tipo) {
    q.gostei = Math.max(0, (q.gostei || 0) - (tipo === "like" ? 1 : 0));
    q.naoGostei = Math.max(0, (q.naoGostei || 0) - (tipo === "dislike" ? 1 : 0));
    delete votedPergunta[qid];
  } else {
    if (anterior === "like") q.gostei = Math.max(0, (q.gostei || 0) - 1);
    if (anterior === "dislike") q.naoGostei = Math.max(0, (q.naoGostei || 0) - 1);
    if (tipo === "like") q.gostei = (q.gostei || 0) + 1;
    else q.naoGostei = (q.naoGostei || 0) + 1;
    votedPergunta[qid] = tipo;
  }
  save(); render(true);
}
function votar(qid, i, tipo){
  if (!exigir()) return;
  const q = D.q.find(x => x.id === qid);
  if (!q || !q.r[i]) return;
  const k = qid + "-" + i;
  const anterior = voted[k];
  const resposta = q.r[i];

  // Remove a reação anterior, se houver.
  if (anterior === "like" || anterior === true) {
    resposta.n = Math.max(0, (resposta.n || 0) - 1);
  } else if (anterior === "dislike") {
    resposta.dn = Math.max(0, (resposta.dn || 0) - 1);
  }

  // Clicar novamente na mesma reação remove o voto.
  if (anterior === tipo || (anterior === true && tipo === "like")) {
    delete voted[k];
  } else {
    if (tipo === "like") {
      resposta.n = (resposta.n || 0) + 1;
      criarNotificacao(resposta.a, "like", ME(), q, "");
    } else {
      resposta.dn = (resposta.dn || 0) + 1;
    }
    voted[k] = tipo;
  }
  save(); render(true);
}
function toggleComentarios(qid, indice){
  const chaveComentario = qid + "-" + indice;
  if (comentariosAbertos.has(chaveComentario)) comentariosAbertos.delete(chaveComentario);

function trocarFoto(inp){
  const f = inp && inp.files && inp.files[0]; if (!f) return;
  if (!f.type || !f.type.startsWith("image/")) { alert("Selecione um arquivo de imagem válido."); return; }

      const S = 240, c = document.createElement("canvas"); c.width = c.height = S;
      const m = Math.min(im.width, im.height);
      c.getContext("2d").drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, 0, S, S);

    im.src = rd.result;
  };

function rotuloDia(t){

  const sugest = [...new Set([...ranking.map(r => r[0]), ...Object.keys(D.users || {})])].filter(n => n !== me && !cs.some(c => c.com === n)).slice(0, 4)
    .map(n => `<a class="btn g s" href="#/mensagens/${encodeURIComponent(n)}">${esc(n)}</a>`).join(" ");
  const direita = com ? viewConversa(me, com, true)
    : `<div class="conv"><div class="cvazio">${ico("msg")}<b style="color:var(--k)">Suas mensagens</b>Escolha uma conversa ou comece uma nova com:<div>${sugest}</div></div></div>`;
  return `<div class="card sec"><div class="sh">Chat${cs.length ? `<small style="font-weight:400;font-size:12px;color:var(--mut)">${pl(cs.length, "conversa", "conversas")}</small>` : ""}</div>
    <div class="chatbox ${com ? "aberta" : ""}"><div class="clist">${itens || '<div class="empty">Nenhuma conversa ainda.</div>'}</div>${direita}</div></div>`;
}

/* ================= ROTEADOR ================= */
const vistas = new Set();
function render(manter){
  renderHeader();
  const p = (location.hash.replace(/^#\/?/, "")).split("/");
  let html, ativo = "home";
  if (p[0] === "pergunta") {
    const id = +p[1];
    const perguntaAberta = D.q.find(x => x.id === id);
    if (!manter && !vistas.has(id)) {
      const q = perguntaAberta;
      if (q) {
        vistas.add(id);
        apiRequest(`/perguntas/${id}/visualizacao`, {method:"POST"})
          .then(() => { q.v = (q.v || 0) + 1; save(); })
          .catch(error => console.warn("Não foi possível registrar visualização.", error));
      }
    }
    html = viewPergunta(id);
  }
  else if (p[0] === "perguntar") { html = viewPerguntar(); ativo = "perguntar"; }
  else if (p[0] === "ranking") { html = viewRanking(); ativo = ""; }
  else if (p[0] === "categorias") { html = viewCategorias(); ativo = "categorias"; }
  else if (p[0] === "contatos") { if (!exigir()) return; html = viewContatos(); ativo = "contatos"; }
  else if (INFO[p[0]]) { html = viewInfo(p[0]); ativo = ""; }
  else if (p[0] === "chat") { location.hash = "#/mensagens" + (p[1] ? "/" + p[1] : ""); return; }
  else if (p[0] === "mensagens") { if (!exigir()) return; html = `<div class="messages-page"><div class="card sec"><div class="sh">Mensagens</div>${viewChat(ME(), true, p[1] ? decodeURIComponent(p[1]) : "")}</div></div>`; ativo = ""; }
  else if (p[0] === "notificacoes") { if (!exigir()) return; html = viewNotificacoes(); ativo = ""; }
  else if (p[0] === "perfil" && p[1] === "editar") { if (!exigir()) return; html = viewEditarPerfil(); ativo = ""; }
  else if (p[0] === "perfil" && p[1] === "chat") { location.hash = "#/mensagens" + (p[2] ? "/" + p[2] : ""); return; }
  else if (p[0] === "perfil") { if (!exigir()) return; html = `<div class="profile-page">${viewPerfil(ME(), p[1], p[2] ? decodeURIComponent(p[2]) : "")}</div>`; ativo = p[1] === "respostas" ? "respostas" : ""; }
  else if (p[0] === "entrar" || p[0] === "cadastro") { if (ME()) { location.hash = "#/"; return; } html = viewAuth(p[0]); ativo = ""; }
  else if (p[0] === "admin") { if (!exigir()) return; html = viewAdmin(); ativo = ""; }
  else if (p[0] === "usuario") { html = `<div class="profile-page">${viewPerfil(decodeURIComponent(p[1] || ME() || DEMO), p[2])}</div>`; ativo = ""; }
  else html = viewHome();
  const y = window.scrollY;
  $("#app").innerHTML = html;
  if (p[0] === "contatos") montarListaContatos("");
  const mb = $("#msgs"); if (mb) mb.scrollTop = mb.scrollHeight;
  renderHeader();
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === ativo));
  if (manter) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

/* ====== SINCRONIZAÇÃO SOCIAL REAL COM CLOUDFLARE D1 ====== */
// Contagens de curtidas e comentários chegam prontas em /api/perguntas (públicas).
// /api/social traz apenas o que é do usuário logado + quem segue quem.
async function sincronizarSocial(){
  if (!ME()) return;
  const data = await apiRequest("/social");
  const eu = ME();
  D.seg = {}; D.seguidores = {}; D.chats = {}; D.lido = D.lido || {};
  Object.keys(voted).forEach(k => delete voted[k]);
  Object.keys(votedPergunta).forEach(k => delete votedPergunta[k]);
  (data.follows || []).forEach(f => {
    (D.seguidores[f.following] = D.seguidores[f.following] || []).push(f.follower);
    if (f.follower === eu) D.seg[f.following] = true;
  });
  (data.reactions || []).forEach(l => {
    const id = Number(l.target_id);
    if (l.target_type === "question") { votedPergunta[id] = l.reaction; return; }
    for (const q of D.q) {
      const i = q.r.findIndex(x => x.id === id);
      if (i >= 0) { voted[q.id + "-" + i] = l.reaction; break; }
    }
  });
  D.notificacoes = (data.notifications || []).map(n => ({
    id: n.id, para: eu, tipo: n.kind, ator: n.actor, qid: n.question_id,
    pergunta: n.question || "", detalhe: n.text, t: Date.parse(n.created_at), lida: !!n.is_read
  }));
  (data.messages || []).forEach(m => {
    const k = chave(m.sender, m.receiver);
    (D.chats[k] = D.chats[k] || []).push({de: m.sender, x: m.text, t: Date.parse(m.created_at), lida: m.sender === eu || !!m.is_read});
  });
  save();
}
async function atualizarTudo(){
  await carregarPerguntasServidor();
  await sincronizarSocial();
}

const cadastrarBaseSocial = cadastrar;
cadastrar = async function(){ await cadastrarBaseSocial(); if (ME()) { try { await sincronizarSocial(); render(true); } catch(e) { console.warn(e); } } };
const loginBaseSocial = fazerLogin;
fazerLogin = async function(){ await loginBaseSocial(); if (ME()) { try { await sincronizarSocial(); render(true); } catch(e) { console.warn(e); } } };
const sairBaseSocial = sair;
sair = async function(){
  D.chats = {}; D.notificacoes = []; D.seg = {};
  Object.keys(voted).forEach(k => delete voted[k]);
  Object.keys(votedPergunta).forEach(k => delete votedPergunta[k]);
  await sairBaseSocial();
};

votarPergunta = async function(qid, tipo){
  if (!exigir()) return;
  try {
    await apiRequest("/social/like", {method:"POST", body:{target_type:"question", target_id:qid, reaction: votedPergunta[qid] === tipo ? "" : tipo}});
    await atualizarTudo(); render(true);
  } catch(e) { alert(e.message); }
};
votar = async function(qid, i, tipo){
  if (!exigir()) return;
  const q = D.q.find(x => x.id === qid), a = q && q.r[i];
  if (!a) return;
  try {
    await apiRequest("/social/like", {method:"POST", body:{target_type:"answer", target_id:a.id, reaction: voted[qid + "-" + i] === tipo ? "" : tipo}});
    await atualizarTudo(); render(true);
  } catch(e) { alert(e.message); }
};
enviarComentario = async function(event, qid, indice){
  if (event) event.preventDefault();
  if (!exigir()) return;
  const campo = $("#comentario-" + qid + "-" + indice), erroEl = $("#comentario-erro-" + qid + "-" + indice);
  const q = D.q.find(x => x.id === qid), a = q && q.r[indice], txt = campo ? campo.value.trim() : "";
  if (!a || txt.length < 2) { if (erroEl) erroEl.textContent = "Escreva pelo menos 2 caracteres."; return; }
  try {
    await apiRequest("/social/comment", {method:"POST", body:{answer_id:a.id, text:txt}});
    await atualizarTudo(); render(true);
  } catch(e) { if (erroEl) erroEl.textContent = e.message; }
};
seguir = async function(nome){
  if (!exigir()) return;
  try { await apiRequest("/social/follow", {method:"POST", body:{username:nome}}); await sincronizarSocial(); render(true); }
  catch(e) { alert(e.message); }
};
enviarMsg = async function(nome){
  if (!exigir()) return;
  const inp = $("#msgIn"), txt = inp ? inp.value.trim() : "";
  if (!txt) return;
  try {
    await apiRequest("/social/message", {method:"POST", body:{to:nome, text:txt}});
    await sincronizarSocial(); render(true);
    const n = $("#msgIn"); if (n) n.focus();
  } catch(e) { alert(e.message); }
};
viewNotificacoes = function(){
  if (!ME()) return promptLogin("ver suas notificações");
  if ((D.notificacoes || []).some(n => !n.lida)) {
    apiRequest("/social/read", {method:"POST"})
      .then(() => { (D.notificacoes || []).forEach(n => n.lida = true); save(); renderHeader(); })
      .catch(() => {});
  }
  const textos = {follow:"começou a seguir você", message:"enviou uma mensagem", comment:"comentou na sua resposta", answer:"respondeu à sua pergunta", like:"curtiu seu conteúdo", best:"escolheu sua resposta como a melhor"};
  const icones = {follow:"userplus", message:"msg", comment:"chat", answer:"check", like:"thumb", best:"check"};
  const lista = (D.notificacoes || []).slice().sort((a, b) => b.t - a.t);
  return `<div class="notif-page"><div class="card sec"><div class="sh">Notificações <small style="font-weight:400;color:var(--mut)">${lista.length} no total</small></div>${lista.length ? lista.map(n => {
    const href = n.tipo === "message" ? `#/mensagens/${encodeURIComponent(n.ator)}` : n.tipo === "follow" ? userHref(n.ator) : (n.qid ? `#/pergunta/${n.qid}` : "#/");
    return `<a class="notif-item ${n.lida ? "" : "unread"}" href="${href}"><span class="notif-icon">${ico(icones[n.tipo] || "bell")}</span><span class="notif-body"><b>${esc(n.ator)}</b> ${esc(textos[n.tipo] || "interagiu com você")}${n.pergunta ? `: “${esc(n.pergunta)}”` : ""}<small>${tempoNotificacao(n.t)}</small></span></a>`;
  }).join("") : `<div class="notif-empty">${ico("bell")}<p>Você ainda não tem notificações.</p><small>Quando alguém responder, curtir, comentar, seguir você ou mandar mensagem, aparecerá aqui.</small></div>`}</div></div>`;
};

/* ====== MODERAÇÃO E PAINEL DO ADMINISTRADOR ====== */
async function acaoModeracao(path, pergunta) {
  if (!exigir()) return false;
  if (pergunta && !confirm(pergunta)) return false;
  try { await apiRequest(path, {method:"POST"}); await atualizarTudo(); return true; }
  catch(e) { alert(e.message); return false; }
}
async function excluirPergunta(id) {
  if (await acaoModeracao(`/perguntas/${id}/excluir`, "Excluir esta pergunta e todas as respostas dela?")) location.hash = "#/";
}
async function excluirResposta(id) {
  if (await acaoModeracao(`/respostas/${id}/excluir`, "Excluir esta resposta?")) render(true);
}
async function excluirComentario(id) {
  if (await acaoModeracao(`/comentarios/${id}/excluir`, "Excluir este comentário?")) render(true);
}
async function marcarMelhor(id) {
  if (await acaoModeracao(`/respostas/${id}/melhor`)) render(true);
}

let adminDados = null, adminErro = "", adminCarregando = false;
async function carregarAdmin() {
  if (adminCarregando) return;
  adminCarregando = true;
  try { adminDados = await apiRequest("/admin/resumo"); adminErro = ""; }
  catch(e) { adminErro = e.message; }
  finally { adminCarregando = false; if (/^#\/admin/.test(location.hash)) render(true); }
}
async function adminUsuario(nome, acao) {
  const msg = acao === "excluir"
    ? `Excluir a conta "${nome}" e TODO o conteúdo dela? Isso não pode ser desfeito.`
    : `Alterar o cargo de administrador de "${nome}"?`;
  if (!confirm(msg)) return;
  try {
    await apiRequest(`/admin/usuarios/${encodeURIComponent(nome)}/${acao}`, {method:"POST"});
    await Promise.all([carregarAdmin(), atualizarTudo()]);
  } catch(e) { alert(e.message); }
}
function viewAdmin() {
  if (!ADM()) return `<div class="card"><div class="empty">Esta área é exclusiva para administradores.</div></div>`;
  if (!adminDados && !adminErro) { carregarAdmin(); return `<div class="card"><div class="empty">Carregando painel...</div></div>`; }
  if (adminErro) return `<div class="card"><div class="empty">${esc(adminErro)} <button class="btn o" onclick="adminErro='';carregarAdmin()">Tentar de novo</button></div></div>`;
  const t = adminDados.totais || {};
  const itens = [["Usuários", t.usuarios], ["Perguntas", t.perguntas], ["Respostas", t.respostas], ["Comentários", t.comentarios], ["Mensagens", t.mensagens], ["Sessões ativas", t.sessoes_ativas]];
  const linhas = (adminDados.usuarios || []).map(u => `
    <tr>
      <td><a href="${userHref(u.username)}"><b>${esc(u.username)}</b></a>${u.is_admin ? ` <span class="admin-tag">admin</span>` : ""}</td>
      <td class="admin-mut">${esc(u.email || "")}</td>
      <td>${Number(u.perguntas || 0)}</td>
      <td>${Number(u.respostas || 0)}</td>
      <td class="admin-mut">${u.created_at ? esc(new Date(u.created_at).toLocaleDateString("pt-BR")) : ""}</td>
      <td><div class="admin-actions">${u.username === ME() ? `<span class="admin-mut">você</span>` : `
        <button type="button" class="mod-btn" onclick="adminUsuario('${esc(u.username)}','admin')">${u.is_admin ? "Remover admin" : "Tornar admin"}</button>
        ${u.is_admin ? "" : `<button type="button" class="mod-btn danger" onclick="adminUsuario('${esc(u.username)}','excluir')">Excluir conta</button>`}`}
      </div></td>
    </tr>`).join("");
  return `<div class="admin-page">
    <div class="card sec">
      <div class="sh">Painel do administrador <small style="font-weight:400;color:var(--mut)">logado como ${esc(ME())}</small></div>
      <div class="admin-stats">${itens.map(([n, v]) => `<div class="admin-stat"><b>${Number(v || 0)}</b><span>${n}</span></div>`).join("")}</div>
      <p class="admin-mut admin-tip">Para moderar perguntas, respostas e comentários, abra qualquer pergunta: como administrador você vê o botão Excluir em todo conteúdo.</p>
    </div>
    <div class="card sec">
      <div class="sh">Usuários <button type="button" class="mod-btn" onclick="carregarAdmin()">Atualizar</button></div>
      <div class="admin-table-wrap"><table class="admin-table">
        <thead><tr><th scope="col">Usuário</th><th scope="col">E-mail</th><th scope="col">Perguntas</th><th scope="col">Respostas</th><th scope="col">Desde</th><th scope="col"><span class="sr-only">Ações</span></th></tr></thead>
        <tbody>${linhas || `<tr><td colspan="6" class="admin-mut">Nenhum usuário.</td></tr>`}</tbody>
      </table></div>
    </div>
  </div>`;
}

// Atualização quase em tempo real: consulta uma assinatura leve a cada 4 s
// e só recarrega os dados quando outra pessoa (ou você em outra aba) mudou algo.
async function verificarNovidades(){
  if (document.visibilityState !== "visible" || sincronizando || !D.carregado) return;
  try {
    const p = await lerPulso();
    if (p && p !== pulsoAtual) await carregarDadosServidor();
  } catch(e) { /* rede instável: tenta de novo no próximo ciclo */ }
}
setInterval(verificarNovidades, 4000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") verificarNovidades(); });
window.addEventListener("focus", verificarNovidades);
